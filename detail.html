<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail de la question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/detail.js" defer></script>
</head>
<body class="bg-light" onload="loadXMLDocAndDisplayBook()">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Détail de la question</h1>
                    </div>

                    <div class="card-body">
                        <div class="mb-3">
                            <label for="enonce" class="form-label fw-bold">Question</label>
                            <input type="text" id="enonce" class="form-control" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="choix" class="form-label fw-bold">Choix de réponses</label>
                            <textarea id="choix" class="form-control" rows="4" readonly></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="reponse" class="form-label fw-bold">Bonne réponse</label>
                                <input type="text" id="reponse" class="form-control" readonly>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="point" class="form-label fw-bold">Points</label>
                                <input type="text" id="point" class="form-control" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer text-end">
                        <a href="javascript:history.back()" class="btn btn-secondary">&larr; Retour</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
